function openBlockModal(cid,presetDate){
  if(!isAdmin())return;
  const today='2026-06-09';
  const date=presetDate||'';
  const slots=terminSlots();
  const slotOpts=slots.map(s=>`<option value="${s}">${s} Uhr</option>`).join('');
  const existing=state.blockedSlots.filter(b=>b.cid===cid).slice()
    .sort((a,b)=>(a.datum+String(a.uhrzeit)).localeCompare(b.datum+String(b.uhrzeit)));
  const listHTML=existing.length?existing.map(b=>{
    const ds=new Date(b.datum).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});
    const lbl=b.uhrzeit==='ganztags'?'Ganztags gesperrt':b.uhrzeit+' Uhr gesperrt';
    return `<div style="display:flex;align-items:center;gap:8px;padding:6px 9px;background:rgba(204,34,34,.06);border:1px solid #E5C3C3;border-radius:6px;font-size:12px">
      <span style="color:#B02020">🚫</span>
      <span style="flex:1;color:var(--text)"><strong>${ds}</strong> · ${lbl}</span>
      <button onclick="removeBlock('${cid}','${b.datum}','${b.uhrzeit}')" title="Freigeben" style="background:none;border:1px solid #E5C3C3;border-radius:5px;color:#B02020;cursor:pointer;font-size:11px;padding:2px 8px">Freigeben</button>
    </div>`;
  }).join(''):`<div style="font-size:12px;color:var(--text3);padding:6px 0">Noch keine Sperrungen für diese Firma.</div>`;
  const html=`<div class="modal" style="width:440px;max-width:95vw">
    <div class="modal-title"><i class="ti ti-lock" aria-hidden="true"></i> Tag / Zeit blockieren <button class="modal-close" onclick="closeModal()"><i class="ti ti-x" aria-hidden="true"></i></button></div>
    <div style="font-size:12px;color:var(--text2);margin-bottom:10px">Gesperrte Tage/Uhrzeiten sind im Kundenportal bei der Angebots-Terminwahl nicht wählbar.</div>
    <div class="form-group"><label class="form-label">Datum *</label><input class="form-input" type="date" id="blk-date" value="${date}" min="${today}"></div>
    <div class="form-group"><label class="form-label">Umfang</label>
      <div style="display:flex;gap:16px;align-items:center;margin-top:4px">
        <label style="display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer"><input type="radio" name="blk-mode" value="ganztags" checked onchange="document.getElementById('blk-slot').disabled=true"> Ganzer Tag</label>
        <label style="display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer"><input type="radio" name="blk-mode" value="slot" onchange="document.getElementById('blk-slot').disabled=false"> Einzelne Uhrzeit</label>
      </div>
    </div>
    <div class="form-group"><label class="form-label">Uhrzeit</label><select class="form-input" id="blk-slot" disabled>${slotOpts}</select></div>
    <div id="blk-err" style="font-size:11px;color:var(--red);min-height:15px;margin-bottom:2px"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Schließen</button>
      <button class="btn btn-gold" onclick="saveBlock('${cid}')"><i class="ti ti-lock" aria-hidden="true"></i> Sperren</button>
    </div>
    <div style="margin-top:14px;border-top:1px solid #EEE;padding-top:12px">
      <div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px">Aktive Sperrungen (${existing.length})</div>
      <div style="display:flex;flex-direction:column;gap:6px;max-height:180px;overflow-y:auto">${listHTML}</div>
    </div>
  </div>`;
  document.getElementById('modal-container').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()">${html}</div>`;
}
async function saveBlock(cid){
  const date=(document.getElementById('blk-date')||{}).value||'';
  const mode=(document.querySelector('input[name="blk-mode"]:checked')||{}).value||'ganztags';
  const slot=(document.getElementById('blk-slot')||{}).value||'';
  const errEl=document.getElementById('blk-err');
  if(!date){if(errEl)errEl.textContent='Bitte ein Datum wählen.';return;}
  const uhrzeit=mode==='ganztags'?'ganztags':slot;
  if(mode==='slot'&&!uhrzeit){if(errEl)errEl.textContent='Bitte eine Uhrzeit wählen.';return;}
  if(!state.blockedSlots.some(b=>b.cid===cid&&b.datum===date&&b.uhrzeit===uhrzeit)){
    const res=await api('/api/blocked-slots?company_id='+cid,{method:'POST',body:JSON.stringify({cid,datum:date,uhrzeit})});
    if(res&&res.ok){state.blockedSlots.push({cid,datum:date,uhrzeit});}
  }
  const dObj=new Date(date);if(!isNaN(dObj)){state.calYear=dObj.getFullYear();state.calMonth=dObj.getMonth();}
  renderMain();
  openBlockModal(cid,date);
}
async function removeBlock(cid,datum,uhrzeit){
  const res=await api('/api/blocked-slots?company_id='+cid+'&datum='+datum+'&uhrzeit='+encodeURIComponent(uhrzeit),{method:'DELETE'});
  if(res&&res.ok){state.blockedSlots=state.blockedSlots.filter(b=>!(b.cid===cid&&b.datum===datum&&b.uhrzeit===uhrzeit));}
  renderMain();
  if(document.querySelector('.modal-overlay')&&document.getElementById('blk-date'))openBlockModal(cid,datum);
}

function renderDamageTab(v){
  const allMarkers=v.damages.flatMap((d,di)=>(d.markers||[]).map((m,mi)=>({...m,type:d.type||'sonstiges',title:d.title,di,mi,did:d.id})));
  const markersHTML=allMarkers.map(m=>{
    const clickAttr=isAdmin()?`onclick="openDamageFromMarker(event,'${m.did}')" ondblclick="removeMarker('${v.id}','${m.did}',${m.mi},event)"`:`onclick="openDamageFromMarker(event,'${m.did}')"`;
    return `<div class="damage-marker ${m.type}" style="left:${m.x}%;top:${m.y}%;cursor:pointer" title="${m.title}" ${clickAttr}>${dmgSymbols[m.type]||'?'}</div>`;
  }).join('');
  const pendingHTML=isAdmin()?state.pendingMarkers.map(m=>`<div class="damage-marker ${state.activeDmgType}" style="left:${m.x}%;top:${m.y}%;opacity:0.65" title="Neu">${dmgSymbols[state.activeDmgType]}</div>`).join(''):'';
  const typeButtons=isAdmin()?`<div class="damage-type-selector">${Object.keys(dmgLabels).map(t=>`<button class="dtype-btn${state.activeDmgType===t?' active-'+t:''}" onclick="setDmgType('${t}')">${dmgLabels[t]}</button>`).join('')}</div>`:'';
  const svgClickAttr=isAdmin()?`onclick="addMarkerOnCar(event,'${v.id}')" class="car-svg-container clickable"`:`class="car-svg-container"`;
  const svgId=isAdmin()?`id="car-svg-wrap-${v.id}"`:'';
  const statusLabels={open:'Offen',closed:'Abgeschlossen','in-progress':'In Bearbeitung',werkstatt:'In der Werkstatt'};
  const statusIcons={open:'ti-alert-circle',closed:'ti-circle-check','in-progress':'ti-clock',werkstatt:'ti-tools'};
  const dmgList=v.damages.length?v.damages.map(d=>`<div class="damage-item ${d.status}" data-did="${d.id}">
    <div class="damage-icon"><i class="ti ${statusIcons[d.status]||'ti-tools'}" aria-hidden="true"></i></div>
    <div style="flex:1">
      <div class="damage-title">${d.title}</div>
      <div class="damage-meta">${dmgLabels[d.type]||'Schaden'} · ${d.desc} · ${new Date(d.date).toLocaleDateString('de-DE')} · ${Number(d.cost).toLocaleString('de-DE')} €</div>
    </div>
    <span class="badge ${d.status==='open'?'badge-danger':d.status==='in-progress'?'badge-warn':'badge-ok'}">${statusLabels[d.status]}</span>
    ${isAdmin()?`<button onclick="event.stopPropagation();deleteDamage('${d.id}','${v.id}')" style="flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(255,68,68,0.15);border:1px solid rgba(255,68,68,0.4);border-radius:6px;padding:4px 8px;cursor:pointer;color:#ff4444;font-size:14px;font-weight:bold;align-self:center" title="Schaden löschen">✕</button>`:''}
  </div>`).join(''):`<div class="empty-state"><div class="empty-icon"><i class="ti ti-mood-happy" aria-hidden="true"></i></div><div class="empty-text">Keine Schäden erfasst</div></div>`;

  const addBtn=isAdmin()?`<button class="btn btn-gold" style="align-self:flex-start" onclick="openModal('damage','${v.id}')"><i class="ti ti-plus" aria-hidden="true"></i> Schaden erfassen</button>`:'';
  const tip=isAdmin()?`<div class="tip-hint"><i class="ti ti-hand-click" style="font-size:12px" aria-hidden="true"></i> Typ wählen, dann auf Fahrzeug klicken um Schaden zu markieren. Einfachklick auf Marker öffnet Schaden. Doppelklick entfernt Marker.</div>`:'';

  return `<div class="damage-tab-layout">
    <div class="car-diagram-wrap">
      <div class="car-diagram-title">
        <span><i class="ti ti-car" style="font-size:12px" aria-hidden="true"></i> Schadenübersicht — Fahrzeugdiagramm</span>
        <span style="font-size:10px;color:var(--text3)">${v.plate}</span>
      </div>
      ${typeButtons}
      <div ${svgClickAttr} ${svgId}>
        ${getVehicleSVG(v.make, v.model, true)}
        ${markersHTML}${pendingHTML}
      </div>
      ${tip}
      <div class="damage-legend">
        ${Object.keys(dmgLabels).map(t=>`<div class="legend-item"><div class="legend-dot" style="background:${dmgColors[t]}"></div>${dmgLabels[t]}</div>`).join('')}
      </div>
    </div>
    <div class="damage-list-below">
      ${dmgList}
      ${addBtn}
    </div>
  </div>`;
}

function setDmgType(t){state.activeDmgType=t;renderVehicleDetail();}

function addMarkerOnCar(e,vid){
  if(!isAdmin())return;
  const wrap=document.getElementById('car-svg-wrap-'+vid);
  if(!wrap)return;
  const rect=wrap.getBoundingClientRect();
  const x=((e.clientX-rect.left)/rect.width*100).toFixed(1);
  const y=((e.clientY-rect.top)/rect.height*100).toFixed(1);
  state.pendingMarkers.push({x:parseFloat(x),y:parseFloat(y)});
  openModal('damageFromMap',vid);
}

function openDamageFromMarker(e,did){
  e.stopPropagation();
  const el=document.querySelector(`.damage-item[data-did="${did}"]`);
  if(el){el.scrollIntoView({behavior:'smooth',block:'nearest'});const prev=el.style.outline;el.style.outline='2px solid var(--gold)';el.style.borderRadius='6px';setTimeout(()=>{el.style.outline=prev;el.style.borderRadius='';},1500);}
}
function removeMarker(vid,did,mi,e){
  if(!isAdmin())return;
  e.stopPropagation();
  const v=state.vehicles.find(x=>x.id===vid);
  const d=v.damages.find(x=>x.id===did);
  if(d&&d.markers)d.markers.splice(mi,1);
  renderVehicleDetail();
}

function saveDokumenteToStorage(){
  const data={};state.vehicles.forEach(v=>{data[v.id]=v.dokumente||[];});
  try{localStorage.setItem('gp_dokumente',JSON.stringify(data));}catch(e){}
}
function deleteDokument(vid,docId){
  if(!confirm('Dokument löschen?'))return;
  const v=state.vehicles.find(x=>x.id===vid);if(!v)return;
  v.dokumente=(v.dokumente||[]).filter(d=>d.id!==docId);
  saveDokumenteToStorage();renderVehicleDetail();
}
function saveNewDokument(vid){
  const name=(document.getElementById('nd-name')||{}).value.trim();
  if(!name)return alert('Dokumentname erforderlich');
  const typ=(document.getElementById('nd-typ')||{}).value;
  const datum=(document.getElementById('nd-datum')||{}).value;
  const v=state.vehicles.find(x=>x.id===vid);if(!v)return;
  if(!v.dokumente)v.dokumente=[];
  v.dokumente.push({id:'doc_'+Date.now(),typ,name,datum:datum||'',beschreibung:''});
  saveDokumenteToStorage();closeModal();renderVehicleDetail();
}
function pdfPage(c){return `<div style="background:#FFF;width:100%;max-width:595px;min-height:600px;margin:0 auto;padding:48px 44px;box-sizing:border-box;font-family:Georgia,serif;font-size:11px;color:#1A1A1A;line-height:1.65;box-shadow:0 2px 16px rgba(0,0,0,.18)">${c}</div>`;}
function pdfHdr(title,sub,docId){return `<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px"><div><div style="font-size:7.5px;letter-spacing:.18em;color:#AAA;text-transform:uppercase;margin-bottom:3px">Goldpark Flottenverwaltung</div><div style="font-size:17px;font-weight:700;color:#1A1A1A;margin-bottom:2px">${title}</div>${sub?`<div style="font-size:10px;color:#888">${sub}</div>`:''}</div><div style="text-align:right;font-size:9px;color:#AAA">${docId?`<div>Dok.-ID: ${docId}</div>`:''}<div>Ausdruck: ${new Date().toLocaleDateString('de-DE')}</div></div></div><hr style="border:none;border-top:2px solid #C9A84C;margin-bottom:18px">`;}
function pdfR(lbl,val){return `<tr><td style="color:#888;padding:3px 0;width:160px;vertical-align:top">${lbl}</td><td style="color:#1A1A1A;vertical-align:top">${val}</td></tr>`;}
function buildPdfDocBody(v,doc){
  const ls=state.leasings.find(l=>l.vid===v.id);
  const dr=state.drivers.find(d=>d.id===v.fahrerId);
  let ext='';
  if(doc.typ==='Vertrag'&&v.besitzart==='Leasing'&&ls){ext=pdfR('Leasinggeber',ls.lessor)+pdfR('Monatl. Rate',ls.monthly.toLocaleString('de-DE',{style:'currency',currency:'EUR'}))+pdfR('Laufzeit',ls.duration+' Monate')+pdfR('Beginn',new Date(ls.start).toLocaleDateString('de-DE'))+pdfR('Ende',new Date(ls.end).toLocaleDateString('de-DE'))+pdfR('Rest-km',ls.restKm?ls.restKm.toLocaleString('de-DE')+' km':'—');}
  return pdfPage(pdfHdr(doc.name,doc.datum?'Datum: '+new Date(doc.datum).toLocaleDateString('de-DE'):'',doc.id)+
    `<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#555;margin-bottom:7px">Fahrzeugdaten</div>`+
    `<table style="width:100%;border-collapse:collapse;margin-bottom:22px">${pdfR('Hersteller / Modell',v.make+' '+v.model)}${pdfR('Kennzeichen','<span style="font-family:monospace">'+v.plate+'</span>')}${pdfR('Baujahr',String(v.year))}${pdfR('Kilometerstand',v.km.toLocaleString('de-DE')+' km')}${pdfR('FIN','<span style="font-family:monospace">'+(v.vin||'—')+'</span>')}${pdfR('Besitzart',v.besitzart)}${dr?pdfR('Fahrer',dr.name||''):''}${ext}</table>`+
    (doc.beschreibung?`<div style="margin-bottom:18px;padding:10px 14px;background:#F9F9F9;border-left:3px solid #C9A84C;font-size:11px">${doc.beschreibung}</div>`:'')+
    `<div style="margin-top:50px;display:flex;justify-content:space-between"><div style="width:180px;border-top:1px solid #AAA;padding-top:5px;font-size:9px;color:#888;text-align:center">Unterschrift Auftraggeber</div><div style="width:180px;border-top:1px solid #AAA;padding-top:5px;font-size:9px;color:#888;text-align:center">Unterschrift Auftragnehmer</div></div>`+
    `<div style="margin-top:36px;padding-top:8px;border-top:0.5px solid #E0E0E0;font-size:9px;color:#AAA;text-align:center">Dieses Dokument ist maschinell erstellt. · Goldpark GmbH · Flottenverwaltungssystem</div>`);
}
function buildPdfInvBody(v,inv){
  const stLabel=inv.status==='paid'?'Bezahlt':inv.status==='open'?'Offen':'In Bearbeitung';
  const stColor=inv.status==='paid'?'#00C853':inv.status==='open'?'#FF1744':'#FFD600';
  return pdfPage(pdfHdr('Rechnung','Nr. '+inv.id.toUpperCase(),'')+
    `<table style="width:100%;border-collapse:collapse;margin-bottom:20px">${pdfR('Fahrzeug',v.make+' '+v.model+' ('+v.plate+')')}${pdfR('Datum',new Date(inv.date).toLocaleDateString('de-DE'))}${pdfR('Art',inv.type)}${pdfR('Beschreibung',inv.desc)}</table>`+
    `<div style="background:#F9F9F9;border-radius:6px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><span style="font-size:12px;color:#888">Rechnungsbetrag</span><span style="font-size:22px;font-weight:700">${inv.amount.toLocaleString('de-DE',{style:'currency',currency:'EUR'})}</span></div>`+
    `<div style="display:flex;align-items:center;gap:8px"><span style="font-size:11px;color:#888">Status:</span><span style="background:${stColor};color:#FFF;font-size:10px;font-weight:700;padding:3px 10px;border-radius:99px">${stLabel}</span></div>`+
    `<div style="margin-top:40px;padding-top:8px;border-top:0.5px solid #E0E0E0;font-size:9px;color:#AAA;text-align:center">Goldpark GmbH · Flottenverwaltungssystem</div>`);
}
function buildPdfHistorieBody(v){
  const invs=state.invoices.filter(i=>i.vid===v.id);
  const ev=[];
  ev.push({date:v.service.date,lbl:'Nächster Service',det:'Intervall: '+v.service.interval.toLocaleString('de-DE')+' km'});
  ev.push({date:v.tuev.date,lbl:'TÜV / Hauptuntersuchung',det:''});
  ev.push({date:v.tires.date,lbl:'Reifenservice',det:v.tires.type});
  ev.push({date:v.detailing.date,lbl:'Fahrzeugaufbereitung',det:''});
  invs.forEach(i=>ev.push({date:i.date,lbl:i.type,det:i.desc+' — '+i.amount.toLocaleString('de-DE',{style:'currency',currency:'EUR'})}));
  v.damages.forEach(d=>ev.push({date:d.date,lbl:'Schaden: '+d.title,det:d.desc+(d.cost?' · KVA: '+parseFloat(d.cost).toLocaleString('de-DE',{style:'currency',currency:'EUR'}):'')+' · '+({open:'Offen',closed:'Behoben','in-progress':'In Bearbeitung'}[d.status]||d.status)}));
  ev.sort((a,b)=>new Date(b.date)-new Date(a.date));
  const rows=ev.map(e=>`<tr><td style="padding:5px 10px 5px 0;color:#888;white-space:nowrap;vertical-align:top;font-size:10px;border-bottom:0.5px solid #F0F0F0">${new Date(e.date).toLocaleDateString('de-DE')}</td><td style="padding:5px 10px 5px 0;font-weight:500;vertical-align:top;border-bottom:0.5px solid #F0F0F0">${e.lbl}</td><td style="padding:5px 0;color:#666;font-size:10px;vertical-align:top;border-bottom:0.5px solid #F0F0F0">${e.det}</td></tr>`).join('');
  return pdfPage(pdfHdr('Fahrzeughistorie',v.make+' '+v.model+' · '+v.plate,'')+
    `<table style="width:100%;border-collapse:collapse">${rows}</table>`+
    `<div style="margin-top:28px;padding-top:8px;border-top:0.5px solid #E0E0E0;font-size:9px;color:#AAA;text-align:center">Goldpark GmbH · Flottenverwaltungssystem · Ausdruck: ${new Date().toLocaleDateString('de-DE')}</div>`);
}
function openPdfPreview(vid,pdfType,ref){
  const v=state.vehicles.find(x=>x.id===vid);if(!v)return;
  const container=document.getElementById('modal-container');if(!container)return;
  let title='',body='';
  if(pdfType==='doc'){const doc=(v.dokumente||[]).find(d=>d.id===ref);if(!doc)return;title=doc.name;body=buildPdfDocBody(v,doc);}
  else if(pdfType==='inv'){const inv=state.invoices.find(i=>i.id===ref);if(!inv)return;title=inv.type+' — '+new Date(inv.date).toLocaleDateString('de-DE');body=buildPdfInvBody(v,inv);}
  else{title='Fahrzeughistorie — '+v.make+' '+v.model;body=buildPdfHistorieBody(v);}
  container.innerHTML=`<div class="modal-overlay" onclick="if(event.target.classList.contains('modal-overlay'))closeModal()"><div style="background:#FFF;border-radius:12px;width:660px;max-width:95vw;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)"><div style="display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid #EBEBEB;flex-shrink:0"><div style="display:flex;align-items:center;gap:8px"><i class="ti ti-file-type-pdf" style="font-size:18px;color:#E53935" aria-hidden="true"></i><span style="font-size:14px;font-weight:600;color:#1A1A1A">${title}</span></div><button class="modal-close" onclick="closeModal()"><i class="ti ti-x" aria-hidden="true"></i></button></div><div style="overflow-y:auto;padding:20px;background:#D8D8D8;flex:1">${body}</div></div></div>`;
}
function renderDokumenteTab(v){
  const invs=state.invoices.filter(i=>i.vid===v.id);
  const docs=v.dokumente||[];
  const vertraege=docs.filter(d=>d.typ==='Vertrag');
  const extraInv=docs.filter(d=>d.typ==='Rechnung');
  const sonstige=docs.filter(d=>d.typ==='Sonstiges');
  const admin=isAdmin();
  const pdfIco=`<div style="width:30px;height:36px;background:#FFF0F0;border:0.5px solid #FFBDBA;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;gap:1px"><i class="ti ti-file-type-pdf" style="font-size:13px;color:#E53935" aria-hidden="true"></i><span style="font-size:7px;color:#E53935;font-weight:700;letter-spacing:.03em">PDF</span></div>`;
  const row=(name,sub,viewCall,delId)=>`<div style="display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:0.5px solid #F2F2F2">${pdfIco}<div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:500;color:#1A1A1A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${name}</div>${sub?`<div style="font-size:10px;color:#AAA;margin-top:1px">${sub}</div>`:''}</div><button class="btn btn-outline" style="font-size:10px;padding:3px 9px;height:auto;flex-shrink:0" onclick="${viewCall}"><i class="ti ti-eye" style="font-size:11px" aria-hidden="true"></i> Ansehen</button>${admin&&delId?`<button class="btn" style="font-size:10px;padding:3px 7px;height:auto;color:#E53935;border:0.5px solid #FFBDBA;background:#FDF3F2;flex-shrink:0" onclick="deleteDokument('${v.id}','${delId}')"><i class="ti ti-trash" style="font-size:11px" aria-hidden="true"></i></button>`:''}</div>`;
  const addBtn=(typ)=>admin?`<button class="btn btn-outline" style="font-size:10px;padding:3px 9px;height:auto" onclick="openModal('addDokument','${v.id}__${typ}')"><i class="ti ti-plus" style="font-size:11px" aria-hidden="true"></i> Hinzufügen</button>`:'';
  const sec=(title,icon,typ,content)=>`<div style="margin-bottom:16px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px"><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);display:flex;align-items:center;gap:5px"><i class="ti ${icon}" aria-hidden="true"></i>${title}</div>${typ!=='__'?addBtn(typ):''}</div>${content}</div>`;
  const vertHTML=vertraege.map(d=>row(d.name,d.datum?new Date(d.datum).toLocaleDateString('de-DE'):'',`openPdfPreview('${v.id}','doc','${d.id}')`,d.id)).join('')||`<div style="font-size:11px;color:#AAA;padding:5px 0 7px">Kein Vertrag vorhanden.</div>`;
  const invHTML=invs.map(i=>{const sl=i.status==='paid'?'Bezahlt':i.status==='open'?'Offen':'Läuft';return row(i.type+' — '+new Date(i.date).toLocaleDateString('de-DE'),i.desc+' · '+i.amount.toLocaleString('de-DE',{style:'currency',currency:'EUR'})+' · '+sl,`openPdfPreview('${v.id}','inv','${i.id}')`,null);}).join('');
  const exInvHTML=extraInv.map(d=>row(d.name,d.datum?new Date(d.datum).toLocaleDateString('de-DE'):'',`openPdfPreview('${v.id}','doc','${d.id}')`,d.id)).join('');
  const recHTML=(invHTML+exInvHTML)||`<div style="font-size:11px;color:#AAA;padding:5px 0 7px">Keine Rechnungen vorhanden.</div>`;
  const sonHTML=sonstige.map(d=>row(d.name,d.datum?new Date(d.datum).toLocaleDateString('de-DE'):'',`openPdfPreview('${v.id}','doc','${d.id}')`,d.id)).join('')||`<div style="font-size:11px;color:#AAA;padding:5px 0 7px">Keine weiteren Dokumente.</div>`;
  const histHTML=row('Fahrzeughistorie — '+v.make+' '+v.model,'Chronologische Übersicht aller Ereignisse',`openPdfPreview('${v.id}','historie','')`,null);
  return `<div style="padding:2px 0">${sec('Vertrag','ti-file-certificate','Vertrag',vertHTML)}${sec('Rechnungen','ti-receipt','Rechnung',recHTML)}${sec('Sonstige Dokumente','ti-folder-open','Sonstiges',sonHTML)}${sec('Fahrzeughistorie','ti-history','__',histHTML)}</div>`;
}

    const fbInfo=(isEdit&&(appt.kundenStatus||appt.kundenNachricht||appt.alternativTermin))?`<div class="cal-fb-box" style="margin-top:4px"><div style="font-weight:600;color:var(--text);margin-bottom:3px;font-size:10px;text-transform:uppercase;letter-spacing:.05em"><i class="ti ti-message-2" aria-hidden="true"></i> Kundenrückmeldung</div><div>Status: <strong>${calStatusLabel(appt.kundenStatus)}</strong></div>${appt.kundenNachricht?`<div style="margin-top:3px">Nachricht: "${appt.kundenNachricht}"</div>`:''}${appt.alternativTermin?`<div style="margin-top:3px">Alternativvorschlag: <strong>${new Date(appt.alternativTermin).toLocaleDateString('de-DE')}</strong></div>`:''}</div>`:'';
    const calSlotOpts=terminSlots().map(s=>`<option value="${s}"${(appt.uhrzeit||'')=== s?' selected':''}>${s} Uhr</option>`).join('');
    html=`<div class="modal"><div class="modal-title">${isEdit?'Termin bearbeiten':'Termin hinzufügen'} <button class="modal-close" onclick="closeModal()"><i class="ti ti-x" aria-hidden="true"></i></button></div>
      <div class="form-group"><label class="form-label">Fahrzeug *</label><select class="form-input" id="cal-vehicle" onchange="calSyncPlate()">${vOpts||'<option value="">Keine Fahrzeuge</option>'}</select></div>
      <div class="form-group"><label class="form-label">Kennzeichen (automatisch)</label><input class="form-input" id="cal-plate" value="${calEscAttr(defaultPlate)}" style="font-family:var(--font-mono);background:#F5F5F5" readonly></div>
      <div class="form-row"><div class="form-group"><label class="form-label">Datum *</label><input class="form-input" id="cal-date" type="date" value="${appt.date||''}"></div><div class="form-group"><label class="form-label">Uhrzeit</label><select class="form-input" id="cal-uhrzeit"><option value="">— Uhrzeit wählen —</option>${calSlotOpts}</select></div></div>
      <div class="form-group"><label class="form-label">Zielort — wohin *</label><input class="form-input" id="cal-ziel" value="${calEscAttr(appt.ziel)}" placeholder="z.B. Werkstatt Auto-Service Frankfurt"></div>
      <div class="form-group"><label class="form-label">Grund — warum *</label><textarea class="form-input" id="cal-grund" rows="2" placeholder="z.B. Inspektion & Ölwechsel">${calEscAttr(appt.grund)}</textarea></div>
      ${fbInfo}
      <div class="modal-actions">${delBtn}<button class="btn btn-outline" onclick="closeModal()">Abbrechen</button><button class="btn btn-gold" onclick="saveCalAppointment('${isEdit?id:''}','${cid}')"><i class="ti ti-check" aria-hidden="true"></i> Speichern</button></div>
    </div>`;
  }
  container.innerHTML=`<div class="modal-overlay" onclick="handleOverlayClick(event,'${type}')">${html}</div>`;
}

  const company=state.companies.find(c=>c.id===cid);

  const payload={
    company_id:cid,
    name,
    licenseClass:(document.getElementById('dr-class')||{value:''}).value.trim()||null,

async function saveCompany(existingId=''){
  const name=document.getElementById('f-name').value.trim();
  if(!name)return alert('Firmenname erforderlich');
  const contact=document.getElementById('f-contact').value.trim();
  const phone=document.getElementById('f-phone').value.trim();
  const email=document.getElementById('f-email').value.trim();
  const errEl=document.getElementById('f-err');
  if(existingId){
    const c=state.companies.find(x=>x.id===existingId);
    const res=await api('/api/companies/'+existingId,{method:'PUT',body:JSON.stringify({...c,name,contact,phone,email})});
    if(res&&res.ok){c.name=name;c.contact=contact;c.phone=phone;c.email=email;}
  }else{
    const loginEmail=(document.getElementById('f-login-email')||{value:''}).value.trim();
    const loginPass=(document.getElementById('f-login-pass')||{value:''}).value;
    if((loginEmail||loginPass)&&(!loginEmail||!loginPass)){
      if(errEl)errEl.textContent='Bitte Login-E-Mail und Passwort zusammen ausfüllen.';
      return;
    }
    if(loginPass&&loginPass.length<8){
      if(errEl)errEl.textContent='Passwort muss mindestens 8 Zeichen haben.';
      return;
    }
    const body={name,contact,phone,email};
    if(loginEmail&&loginPass){body.login_email=loginEmail;body.login_password=loginPass;}
    const res=await api('/api/companies',{method:'POST',body:JSON.stringify(body)});
    if(res&&res.ok){const saved=await res.json();state.companies.push(saved);}
    else if(res&&res.status===409){if(errEl)errEl.textContent='Diese E-Mail-Adresse wird bereits verwendet.';return;}
    else{if(errEl)errEl.textContent='Fehler beim Speichern.';return;}
  }
  closeModal();renderSidebar();if(state.selectedCompany)renderMain();
}
async function deleteCompany(cid){
  const co=state.companies.find(c=>c.id===cid);
  const name=co?co.name:cid;
  if(!confirm(`Firma "${name}" wirklich löschen? Alle Daten gehen verloren.`))return;
  const res=await api('/api/companies/'+cid,{method:'DELETE'});
  if(res&&res.ok){state.companies=state.companies.filter(c=>c.id!==cid);state.vehicles=state.vehicles.filter(v=>v.cid!==cid);state.selectedCompany=null;state.selectedVehicle=null;}
  closeModal();renderSidebar();renderMain();
}
async function saveKundenzugang(cid){
  const emailEl=document.getElementById('ec-login-email');
  const passEl=document.getElementById('ec-login-pass');
  const msgEl=document.getElementById('ec-kz-msg');
  const email=(emailEl||{value:''}).value.trim();
  const password=(passEl||{value:''}).value;
  if(!email&&!password)return;
  if(!email||!password){if(msgEl){msgEl.style.color='var(--red)';msgEl.textContent='Bitte E-Mail und Passwort zusammen ausfüllen.';}return;}
  if(password.length<8){if(msgEl){msgEl.style.color='var(--red)';msgEl.textContent='Passwort muss mindestens 8 Zeichen haben.';}return;}
  const res=await api('/api/companies/'+cid+'/user',{method:'POST',body:JSON.stringify({email,password})});
  if(res&&res.ok){
    if(emailEl)emailEl.value='';
    if(passEl)passEl.value='';
    if(msgEl){msgEl.style.color='var(--green)';msgEl.textContent='Zugang gespeichert.';}
  }else if(res&&res.status===409){
    if(msgEl){msgEl.style.color='var(--red)';msgEl.textContent='Diese E-Mail-Adresse wird bereits verwendet.';}
  }else{
    let errText='Fehler beim Speichern.';
    try{const d=await res.json();if(d&&d.error)errText=d.error;}catch(e){}
    if(msgEl){msgEl.style.color='var(--red)';msgEl.textContent=errText;}
  }
}

function filterFleetVehicles(cid){
  const q=(document.getElementById('fleet-search-input')?.value||'').trim().toLowerCase();
  const company=state.companies.find(c=>c.id===cid);
  const allVehicles=_fleetBaseVehicles||state.vehicles.filter(v=>v.cid===cid);
  const filtered=q?allVehicles.filter(v=>(v.plate||'').toLowerCase().includes(q)||(v.make+' '+v.model).toLowerCase().includes(q)):allVehicles;
  const sec=document.getElementById('vehicles-section');
  if(!sec)return;
  if(!filtered.length){
    sec.innerHTML=`<div class="empty-state"><div class="empty-icon"><i class="ti ti-search" aria-hidden="true"></i></div><div class="empty-text">Keine Fahrzeuge gefunden</div></div>`;
    return;
  }
  sec.innerHTML=buildVehicleSection(filtered,company);
  if(state.selectedVehicle){
    const el=document.querySelector('.vehicle-card[data-vid="'+state.selectedVehicle+'"]');
    if(el)el.classList.add('selected');

// ===== LIVEDATEN MODAL =====
let _liveInterval = null;
let _gpLiveData = null;
let _gpLiveCid = null;

function openLivedatenModal(cid) {
  const company = state.companies.find(c => c.id === cid);
  if (!company) return;
  const vehicles = state.vehicles.filter(v => v.cid === cid);
  _gpLiveCid = cid;
  if (_liveInterval) { clearInterval(_liveInterval); _liveInterval = null; }
  document.getElementById('ld-modal-ol')?.remove();

  function seededRng(seed) {
    let s = seed >>> 0;
    return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
  }

  _gpLiveData = {};
  const statuses = ['driving','driving','driving','driving','idle','pause','problem','offline'];
  vehicles.forEach((v, i) => {
    const seed = v.id.split('').reduce((a, c) => a + c.charCodeAt(0) * (i * 13 + 7), 0);
    const rng = seededRng(seed);
    const status = statuses[Math.floor(rng() * statuses.length)];
    const isDriving = status === 'driving';
    const x = 30 + rng() * 740, y = 25 + rng() * 350;
    _gpLiveData[v.id] = {
      x, y, status,
      fuel: Math.round(8 + rng() * 87),
      speed: isDriving ? Math.round(22 + rng() * 88) : 0,
      doors: { fahrer: rng() > 0.91, beifahrer: rng() > 0.96, heck: rng() > 0.93, schiebe: rng() > 0.97 },
      ignition: isDriving || rng() > 0.42,
      dx: isDriving ? (rng() * 2 - 1) * 0.9 : 0,
      dy: isDriving ? (rng() * 2 - 1) * 0.6 : 0,
      trail: [],
      selected: false,
    };
    if (isDriving) {
      const d = _gpLiveData[v.id];
      let rx = x, ry = y;
      for (let j = 0; j < 10; j++) {
        d.trail.unshift({ x: rx, y: ry });
        rx = Math.max(15, Math.min(785, rx - d.dx * 14 + (rng()-0.5)*12));
        ry = Math.max(15, Math.min(385, ry - d.dy * 14 + (rng()-0.5)*9));
      }
    }
  });

  const ol = document.createElement('div');
  ol.id = 'ld-modal-ol';
  ol.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;z-index:700';
  ol.innerHTML = `<div style="background:#FFF;border-radius:12px;width:92vw;height:90vh;max-width:1440px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 56px rgba(0,0,0,.35)">
    <div style="padding:13px 20px;border-bottom:1px solid #E0E0E0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:#FAFAFA">
      <div style="display:flex;align-items:center;gap:10px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C9A84C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="2"/><path d="M12 11v9"/><path d="M9 20h6"/><path d="M6.5 5.5a7 7 0 0 0 0 7"/><path d="M17.5 5.5a7 7 0 0 1 0 7"/><path d="M4 3.5a10.5 10.5 0 0 0 0 11"/><path d="M20 3.5a10.5 10.5 0 0 1 0 11"/></svg>
        <span style="font-size:16px;font-weight:600;color:#1A1A1A">Livedaten — Flotten\xfcbersicht</span>
        <span style="font-size:10px;background:#E8F5E9;color:#2A7A4A;border:1px solid #B8DFC5;border-radius:20px;padding:3px 10px;display:inline-flex;align-items:center;gap:5px;font-weight:600;letter-spacing:.04em"><span class="ld-pulse-dot" style="width:6px;height:6px;border-radius:50%;background:#2A7A4A;display:inline-block"></span>LIVE — DEMO</span>
      </div>
      <button onclick="closeLivedatenModal()" style="background:none;border:none;cursor:pointer;font-size:24px;color:#999;padding:0 8px;border-radius:5px;line-height:1;font-family:var(--font-sans)" onmouseenter="this.style.color='#333'" onmouseleave="this.style.color='#999'">\xd7</button>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;overflow:hidden">
      <div style="flex:0 0 58%;position:relative;overflow:hidden;border-bottom:2px solid #E0E0E0">
        <svg id="ld-map-svg" viewBox="0 0 800 400" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" style="display:block">${_buildCityMapSVG()}<g id="ld-routes"></g><g id="ld-markers"></g></svg>
        <div id="ld-reset-btn" onclick="ldResetSelection()" style="position:absolute;top:10px;left:12px;background:rgba(255,255,255,.88);border:1px solid #D8D8D8;border-radius:7px;padding:5px 12px;font-size:10px;color:#777;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:0 1px 4px rgba(0,0,0,.08);user-select:none;font-family:var(--font-sans);transition:background .18s,color .18s,border-color .18s,opacity .18s;opacity:0.55" onmouseenter="this.style.boxShadow='0 2px 8px rgba(0,0,0,.14)';this.style.opacity='1'" onmouseleave="this.style.boxShadow='0 1px 4px rgba(0,0,0,.08)'"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg> Alle Fahrzeuge</div>
        <div style="position:absolute;bottom:10px;left:12px;background:rgba(255,255,255,.93);border:1px solid #D8D8D8;border-radius:7px;padding:6px 13px;display:flex;gap:14px;font-size:10px;color:#444;box-shadow:0 1px 4px rgba(0,0,0,.1)">
          <span style="display:flex;align-items:center;gap:5px"><span style="width:8px;height:8px;border-radius:50%;background:#22a849;display:inline-block"></span>F\xe4hrt</span>
          <span style="display:flex;align-items:center;gap:5px"><span style="width:8px;height:8px;border-radius:50%;background:#E8A800;display:inline-block"></span>Steht / Pause</span>
          <span style="display:flex;align-items:center;gap:5px"><span style="width:8px;height:8px;border-radius:50%;background:#CC2222;display:inline-block"></span>Problem</span>
          <span style="display:flex;align-items:center;gap:5px"><span style="width:8px;height:8px;border-radius:50%;background:#AAAAAA;display:inline-block"></span>Offline</span>
        </div>
        <div style="position:absolute;top:10px;right:12px;background:rgba(255,255,255,.88);border:1px solid #D8D8D8;border-radius:7px;padding:5px 10px;font-size:10px;color:#666">📍 Frankfurt am Main (Demo)</div>
      </div>
      <div style="flex:1;overflow-y:auto">
        <div id="ld-vehicle-list"></div>
      </div>
    </div>
  </div>`;
  ol.addEventListener('click', e => { if (e.target === ol) closeLivedatenModal(); });
  document.body.appendChild(ol);

  _renderLiveMarkers(vehicles);
  _renderLiveList(vehicles);

  _liveInterval = setInterval(() => {
    vehicles.forEach(v => {
      const d = _gpLiveData[v.id];
      if (!d || d.status !== 'driving') return;
      d.trail.push({ x: d.x, y: d.y });
      if (d.trail.length > 14) d.trail.shift();
      d.dx += (Math.random()-0.5) * 0.18;
      d.dy += (Math.random()-0.5) * 0.13;
      d.dx = Math.max(-1.5, Math.min(1.5, d.dx));
      d.dy = Math.max(-1.0, Math.min(1.0, d.dy));
      d.x += d.dx; d.y += d.dy;
      if (d.x < 18) { d.dx = Math.abs(d.dx); d.x = 18; }
      if (d.x > 782) { d.dx = -Math.abs(d.dx); d.x = 782; }
      if (d.y < 18) { d.dy = Math.abs(d.dy); d.y = 18; }
      if (d.y > 382) { d.dy = -Math.abs(d.dy); d.y = 382; }
      d.speed = Math.round(Math.max(15, Math.min(130, d.speed + (Math.random()-0.5)*12)));
      d.fuel = Math.max(0, d.fuel - Math.random() * 0.05);
    });
    _renderLiveMarkers(vehicles);
    _renderLiveList(vehicles);
  }, 1600);
}

function closeLivedatenModal() {
  if (_liveInterval) { clearInterval(_liveInterval); _liveInterval = null; }
  document.getElementById('ld-modal-ol')?.remove();
  _gpLiveData = null; _gpLiveCid = null;
}

function _ldStatusColor(s) {
  return ({driving:'#22a849',idle:'#E8A800',pause:'#E8A800',problem:'#CC2222',offline:'#AAAAAA'})[s]||'#AAAAAA';
}
function _ldStatusLabel(s) {
  return ({driving:'F\xe4hrt',idle:'Steht',pause:'Pause',problem:'Problem',offline:'Offline'})[s]||s;
}

function _renderLiveMarkers(vehicles) {
  const rG = document.getElementById('ld-routes');
  const mG = document.getElementById('ld-markers');
  if (!rG || !mG || !_gpLiveData) return;

  const selVid = Object.keys(_gpLiveData).find(id => _gpLiveData[id].selected);
  const displayVehicles = selVid ? vehicles.filter(v => v.id === selVid) : vehicles;

  const svg = document.getElementById('ld-map-svg');
  if (svg) {
    if (selVid && _gpLiveData[selVid]) {
      const sd = _gpLiveData[selVid];
      const vw = 280, vh = 200;
      const vx = Math.max(0, Math.min(520, sd.x - vw / 2));
      const vy = Math.max(0, Math.min(200, sd.y - vh / 2));
      svg.setAttribute('viewBox', vx.toFixed(0) + ' ' + vy.toFixed(0) + ' ' + vw + ' ' + vh);
    } else {
      svg.setAttribute('viewBox', '0 0 800 400');
    }
  }

  const btn = document.getElementById('ld-reset-btn');
  if (btn) {
    if (selVid) {
      btn.style.background = '#C9A84C';
      btn.style.color = '#FFF';
      btn.style.borderColor = '#B8963C';
      btn.style.opacity = '1';
    } else {
      btn.style.background = 'rgba(255,255,255,.88)';
      btn.style.color = '#777';
      btn.style.borderColor = '#D8D8D8';
      btn.style.opacity = '0.55';
    }
  }

  let rSvg = '', mSvg = '';
  displayVehicles.forEach(v => {
    const d = _gpLiveData[v.id];
    if (!d) return;
    const col = _ldStatusColor(d.status);
    const sel = d.selected;
    const sp = v.plate.replace(/\s+/g,'').slice(0,10);
    const lw = sp.length * 5.8 + 9;
    if (d.status === 'driving' && d.trail.length > 1) {
      const pts = d.trail.map((p,i) => (i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ')+'L'+d.x.toFixed(1)+','+d.y.toFixed(1);
      rSvg += '<path d="'+pts+'" stroke="'+col+'" stroke-width="'+(sel?2.5:1.5)+'" fill="none" stroke-dasharray="5,4" opacity="'+(sel?'0.85':'0.5')+'"/>';
    }
    if (d.status === 'driving') {
      mSvg += '<circle cx="'+d.x.toFixed(1)+'" cy="'+d.y.toFixed(1)+'" r="7" fill="none" stroke="'+col+'" stroke-width="1.2" opacity="0.45"><animate attributeName="r" values="7;14;7" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.45;0;0.45" dur="2s" repeatCount="indefinite"/></circle>';
    }
    if (sel) {
      mSvg += '<circle cx="'+d.x.toFixed(1)+'" cy="'+d.y.toFixed(1)+'" r="18" fill="'+col+'" opacity="0.15" stroke="'+col+'" stroke-width="2"/>';
    }
    const mr = sel ? 10 : 7;
    mSvg += '<circle cx="'+d.x.toFixed(1)+'" cy="'+d.y.toFixed(1)+'" r="'+mr+'" fill="'+col+'" stroke="#FFF" stroke-width="2" style="cursor:pointer" onclick="ldSelectVehicle(\''+v.id+'\')"/>';
    const lx = (d.x + 10).toFixed(1), ly = (d.y - 8).toFixed(1), lyt = (d.y + 3.5).toFixed(1), ltx = (d.x + 14).toFixed(1);
    mSvg += '<rect x="'+lx+'" y="'+ly+'" width="'+lw+'" height="13" rx="3" fill="rgba(0,0,0,0.72)" style="cursor:pointer" onclick="ldSelectVehicle(\''+v.id+'\')"/>';
    mSvg += '<text x="'+ltx+'" y="'+lyt+'" font-size="7.5" fill="#FFF" font-family="\'JetBrains Mono\',monospace" font-weight="600" style="cursor:pointer" onclick="ldSelectVehicle(\''+v.id+'\')">'+sp+'</text>';
  });
  rG.innerHTML = rSvg;
  mG.innerHTML = mSvg;
}

function _renderLiveList(vehicles) {
  const el = document.getElementById('ld-vehicle-list');
  if (!el || !_gpLiveData) return;
  const rows = vehicles.map(v => {
    const d = _gpLiveData[v.id];
    if (!d) return '';
    const col = _ldStatusColor(d.status);
    const lbl = _ldStatusLabel(d.status);
    const isElec = v.fuel === 'Elektro';
    const fp = Math.round(d.fuel);
    const fc = fp > 40 ? '#22a849' : fp > 20 ? '#E8A800' : '#CC2222';
    const fi = isElec ? '🔋' : '⛽';
    const od = [];
    if (d.doors.fahrer)    od.push('Fahrert\xfcr');
    if (d.doors.beifahrer) od.push('Beifahrert\xfcr');
    if (d.doors.heck)      od.push('Heckt\xfcr');
    if (d.doors.schiebe)   od.push('Schiebet\xfcr');
    const doorHtml = od.length
      ? '<span style="color:#CC2222;font-weight:500">🚪 '+od.join(', ')+' offen</span>'
      : '<span style="color:#2A7A4A">🚪 Alle T\xfcren geschlossen</span>';
    const ignHtml = d.ignition
      ? '<span style="color:#22a849;font-weight:500">🔑 Z\xfcndung an</span>'
      : '<span style="color:#AAAAAA">🔑 Z\xfcndung aus</span>';
    const sel = d.selected;
    const bg = sel ? '#FFFBF0' : '';
    const bl = sel ? '4px solid #C9A84C' : '3px solid transparent';
    const dotSz = sel ? '12px' : '9px';
    const dotShadow = sel ? '0 0 9px '+col+'70' : '0 0 5px '+col+'20';
    const fuelBarH = sel ? '7' : '5';
    const fuelPct = '<span style="font-weight:700;color:'+fc+';font-size:'+(sel?'15px':'11px')+'">'+fp+'%</span>';
    const speedHtml = d.status==='driving'
      ? '<span style="font-weight:700;color:#1A1A1A;font-size:'+(sel?'18px':'14px')+'">'+d.speed+'</span> <span style="font-size:10px;color:#888">km/h</span>'
      : '<span style="color:#CCCCCC">&#8212; km/h</span>';
    const badgePad = sel ? '4px 13px' : '2px 9px';
    const badgeFz = sel ? '12px' : '11px';
    return '<div id="ld-row-'+v.id+'" onclick="ldSelectVehicle(\''+v.id+'\')" style="display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:0.5px solid #F0F0F0;cursor:pointer;background:'+bg+';border-left:'+bl+';transition:background .15s" onmouseenter="this.style.background=\'#F8F8F8\'" onmouseleave="this.style.background=\''+bg+'\'">' +
      '<span style="width:'+dotSz+';height:'+dotSz+';border-radius:50%;background:'+col+';flex-shrink:0;box-shadow:'+dotShadow+'"></span>' +
      '<div style="flex:0 0 170px;min-width:0"><div style="font-size:12px;font-weight:600;color:#1A1A1A;font-family:var(--font-mono)">'+v.plate+'</div><div style="font-size:10px;color:#888;margin-top:1px">'+v.make+' '+v.model+'</div></div>' +
      '<div style="flex:0 0 80px"><span style="font-size:'+badgeFz+';font-weight:600;color:'+col+';background:'+col+'22;border-radius:20px;padding:'+badgePad+'">'+lbl+'</span></div>' +
      '<div style="flex:0 0 140px"><div style="display:flex;align-items:center;gap:5px;font-size:11px;color:#555">'+fi+' '+fuelPct+'</div><div style="margin-top:3px;height:'+fuelBarH+'px;background:#EBEBEB;border-radius:3px;width:110px;overflow:hidden"><div style="height:'+fuelBarH+'px;background:'+fc+';border-radius:3px;width:'+fp+'%;transition:width .9s ease"></div></div></div>' +
      '<div style="flex:0 0 80px;font-size:11px;color:#555">'+speedHtml+'</div>' +
      '<div style="flex:1;min-width:0;font-size:10px;display:flex;gap:14px;align-items:center;flex-wrap:wrap">'+doorHtml+ignHtml+'</div>' +
    '</div>';
  });
  el.innerHTML = '<div style="display:flex;align-items:center;padding:6px 16px;background:#F8F8F8;border-bottom:1px solid #E8E8E8;font-size:10px;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:.06em;gap:10px;position:sticky;top:0;z-index:1">' +
    '<span style="width:9px;flex-shrink:0"></span>' +
    '<span style="flex:0 0 170px">Kennzeichen / Modell</span>' +
    '<span style="flex:0 0 80px">Status</span>' +
    '<span style="flex:0 0 140px">Tank / Ladestand</span>' +
    '<span style="flex:0 0 80px">Geschw.</span>' +
    '<span style="flex:1">T\xfcren &amp; Z\xfcndung</span>' +
  '</div>' + rows.join('');
}

function ldSelectVehicle(vid) {
  if (!_gpLiveData || !_gpLiveCid) return;
  const vehicles = state.vehicles.filter(v => v.cid === _gpLiveCid);
  const wasSelected = _gpLiveData[vid] && _gpLiveData[vid].selected;
  Object.keys(_gpLiveData).forEach(id => { _gpLiveData[id].selected = false; });
  if (_gpLiveData[vid]) _gpLiveData[vid].selected = !wasSelected;
  _renderLiveMarkers(vehicles);
  _renderLiveList(vehicles);
  if (!wasSelected) {
    setTimeout(() => {
      const rowEl = document.getElementById('ld-row-' + vid);
      if (rowEl) rowEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 60);
  }
}
function ldResetSelection() {
  if (!_gpLiveData || !_gpLiveCid) return;
  const vehicles = state.vehicles.filter(v => v.cid === _gpLiveCid);
  Object.keys(_gpLiveData).forEach(id => { _gpLiveData[id].selected = false; });
  _renderLiveMarkers(vehicles);
  _renderLiveList(vehicles);
}

  const a=state.angebote.find(x=>x.id===angId);if(!a)return;
  const dateStr=a.terminDatum?new Date(a.terminDatum).toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'}):'—';
  const html=`<div class="modal" style="width:380px;max-width:94vw">

    <div style="font-size:13px;color:var(--text);font-weight:600">${dateStr} · ${a.terminUhrzeit||''} Uhr</div>
    <div style="font-size:12px;color:var(--text2);margin-top:6px">${escHtml(a.titel||a.beschreibung||'')}</div>
    ${a.terminNachricht?`<div style="font-size:11px;color:var(--text3);margin-top:6px">${escHtml(a.terminNachricht)}</div>`:''}
    <div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Schließen</button></div>

// ===== MOBILE SIDEBAR =====
function toggleSidebar(){
  const sb=document.getElementById('sidebar');
  const ov=document.getElementById('sidebar-overlay');
  if(!sb)return;
  const open=sb.classList.toggle('open');
  if(ov)ov.classList.toggle('open',open);
}
function closeSidebar(){
  const sb=document.getElementById('sidebar');
  const ov=document.getElementById('sidebar-overlay');
  if(sb)sb.classList.remove('open');
  if(ov)ov.classList.remove('open');
}

// ===== AUTOCOMPLETE OFF =====
(function(){
  var _acFix=function(){
    document.querySelectorAll('input').forEach(function(el){
      var ac=el.getAttribute('autocomplete');
      if(!ac||ac==='off')return;
      var keep=['email','current-password','username','new-password'];
      if(keep.indexOf(ac)<0)el.setAttribute('autocomplete','off');
    });
    document.querySelectorAll('input:not([autocomplete])').forEach(function(el){
      el.setAttribute('autocomplete','off');
    });
  };
  var obs=new MutationObserver(_acFix);
  obs.observe(document.documentElement,{childList:true,subtree:true});
})();
